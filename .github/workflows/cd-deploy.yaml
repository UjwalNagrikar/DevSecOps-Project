name: Deploy with ArgoCD

on:
  push:
    branches:
      - main
    paths:
      - 'argocd/**'
      - 'helm/**'
      - '.github/workflows/cd-deploy.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: gcr.io
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: devsecops-gke-cluster
  GKE_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Add Helm repositories
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --values argocd/values.yaml \
            --wait

      - name: Configure ArgoCD Application
        run: |
          kubectl apply -f argocd/application-dev.yaml
          kubectl apply -f argocd/application-staging.yaml
          kubectl apply -f argocd/application-prod.yaml

      - name: Wait for ArgoCD sync
        run: |
          kubectl wait --for=condition=Synced application/devsecops-app-dev \
            --namespace=argocd \
            --timeout=600s || true

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/devsecops-app \
            --namespace=devsecops \
            --timeout=5m

      - name: Run smoke tests
        run: |
          kubectl exec -it deployment/devsecops-app \
            -n devsecops \
            -- sh -c "curl -f http://localhost:8080/health || exit 1"

      - name: Notify deployment
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment successful'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
