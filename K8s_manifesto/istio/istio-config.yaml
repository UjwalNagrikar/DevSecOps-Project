---
# Istio Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    istio-injection: enabled

---
# Virtual Service for routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devsecops-app
  namespace: devsecops
spec:
  hosts:
    - devsecops-app
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: devsecops-app
            port:
              number: 80
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

---
# Destination Rule with mTLS and load balancing
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: devsecops-app
  namespace: devsecops
spec:
  host: devsecops-app
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 2
    loadBalancer:
      simple: LEAST_CONN
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minRequestVolume: 5
      splitExternalLocalOriginErrors: true
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
# PeerAuthentication - Enforce mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: devsecops
spec:
  mtls:
    mode: STRICT

---
# RequestAuthentication - JWT validation
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: jwt-auth
  namespace: devsecops
spec:
  jwtRules:
    - issuer: "https://accounts.google.com"
      jwksUri: "https://www.googleapis.com/oauth2/v3/certs"
      audiences: "devsecops-app"

---
# AuthorizationPolicy - Fine-grained access control
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: devsecops-app-authpolicy
  namespace: devsecops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devsecops-app
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-system"]
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
      to:
        - operation:
            methods: ["GET", "HEAD"]
            paths: ["/", "/health", "/ready"]

---
# Ingress Gateway
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: devsecops-gateway
  namespace: devsecops
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: devsecops-tls
      hosts:
        - "devsecops.example.com"
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "devsecops.example.com"

---
# Virtual Service bound to Gateway
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devsecops-gateway-vs
  namespace: devsecops
spec:
  hosts:
    - "devsecops.example.com"
  gateways:
    - devsecops-gateway
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: devsecops-app
            port:
              number: 80
      timeout: 30s
