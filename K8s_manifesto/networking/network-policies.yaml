---
# Network Policy - Deny all ingress by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: devsecops
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Network Policy - Allow traffic from Istio Ingress Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-istio-ingressgateway
  namespace: devsecops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devsecops-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
        - podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 8080

---
# Network Policy - Allow DNS traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: devsecops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

---
# Network Policy - Allow traffic to observability stack
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-observability
  namespace: devsecops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devsecops-app
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 3100
